name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[remember]'
      - name: Tests (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          REQUIRE_TK: '1'
        run: python -m unittest discover -s tests -v
      - name: Tests (Linux virtual display)
        if: runner.os == 'Linux'
        env:
          REQUIRE_TK: '1'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - run: python -m umobile_balance --cli --demo
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash desktop/macos/build.sh --universal
